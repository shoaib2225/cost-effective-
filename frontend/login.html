<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pharmacy Precision</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <!-- Main Style -->
    <link rel="stylesheet" href="style.css">
    <style>
        .login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 102, 255, 0.1) 0%, transparent 60%);
        }
        .login-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 4rem;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .login-logo {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .login-logo span { color: var(--primary-blue); }
        .login-sub {
            color: var(--text-muted);
            margin-bottom: 3rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }
        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        .form-group input:focus {
            border-color: var(--primary-blue);
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(90deg, #0055ff, #0066ff);
            color: white;
            border: none;
            border-radius: 1rem;
            padding: 1.2rem;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.3);
            transition: transform 0.3s;
        }
        .btn-login:hover { transform: translateY(-3px); }
        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-link:hover { color: white; }
        
        .toggle-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .toggle-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <section class="login-section">
        <div class="login-card">
            <div class="login-logo">Clinical<span>Editorial</span></div>
            <p class="login-sub">Sign in to access high-precision pharmaceutical tools.</p>
            
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" id="email" placeholder="doctor@clinic.com" required>
                </div>
                <div class="form-group">
                    <label>PASSWORD</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">Secure Login →</button>
            </form>
            
            <br>
            <a href="signup.html" class="toggle-link">Don't have an account? Sign Up</a>
            <br>
            <a href="index.html" class="back-link">← Return to Homepage</a>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
